name: Feature proposal
description: Propose a product or operational improvement for review.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain who is affected and why this matters.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing implementation unless a constraint requires it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the proposal complete.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
      description: Note data, legal, security, integration, migration, or operational concerns.
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link research, designs, customer feedback, or related work when available.
