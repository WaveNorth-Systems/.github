name: Bug report
description: Report reproducible behavior that differs from the expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, or production exports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the application version, browser, operating system, or deployment environment when relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots or sanitized logs. Remove secrets and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
        - label: I removed credentials, personal data, and production exports.
          required: true
